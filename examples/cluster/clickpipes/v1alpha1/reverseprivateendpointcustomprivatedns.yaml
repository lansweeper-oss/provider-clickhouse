apiVersion: clickpipes.clickhouse.crossplane.io/v1alpha1
kind: ReversePrivateEndpointCustomPrivateDNS
metadata:
  annotations:
    meta.upbound.io/example-id: clickpipes/v1alpha1/reverseprivateendpointcustomprivatedns
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    mapping:
    - privateDnsName: my-service.example.com
    reversePrivateEndpointIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    serviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: clickpipes.clickhouse.crossplane.io/v1alpha1
kind: ReversePrivateEndpoint
metadata:
  annotations:
    meta.upbound.io/example-id: clickpipes/v1alpha1/reverseprivateendpointcustomprivatedns
  labels:
    testing.upbound.io/example-name: confluent
  name: confluent
spec:
  forProvider:
    description: Confluent Cloud PrivateLink
    serviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    type: VPC_ENDPOINT_SERVICE
    vpcEndpointServiceName: ${confluent_network.aws.aws[0].private_link_endpoint_service}

---

apiVersion: clickpipes.clickhouse.crossplane.io/v1alpha1
kind: ReversePrivateEndpoint
metadata:
  annotations:
    meta.upbound.io/example-id: clickpipes/v1alpha1/reverseprivateendpointcustomprivatedns
  labels:
    testing.upbound.io/example-name: mongo
  name: mongo
spec:
  forProvider:
    description: MongoDB GROUP reverse private endpoint
    serviceIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    type: VPC_RESOURCE
    vpcResourceConfigurationId: ${aws_vpclattice_resource_configuration.mongo.id}
    vpcResourceShareArn: ${aws_ram_resource_share.mongo.arn}
