              terraform import clickhouse_service_private_endpoints_attachment.example xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    clickhouse_service_scheduled_scaling:
        subCategory: ""
        description: 'You can use the clickhouse_service_scheduled_scaling resource to manage time-based scaling rules for a ClickHouse Cloud service. A schedule is a set of recurring weekly windows. The server rejects any pair of entries that overlap in time, so at most one window is active at any moment. While a window is active the service uses the replica count, memory bounds, and idle-scaling settings declared on that entry; otherwise the service falls back to its base auto-scaling configuration. ~> Note: This resource is in alpha. Scheduled scaling must be enabled for your organization (canUseScheduledAutoscaling). Reach out to ClickHouse support if the API returns 403 FORBIDDEN. The server currently requires min_replicas == max_replicas per entry, and a maximum of 10 entries per schedule. Hour ranges Hour ranges are asymmetric: start_hour_utc accepts 0–23.end_hour_utc accepts 1–24.start_hour_utc and end_hour_utc must differ.Set start_hour_utc = 0 and end_hour_utc = 24 for a 24-hour window.Set end_hour_utc < start_hour_utc to wrap overnight (e.g. 22 to 6 covers 22:00–06:00 next day). Example Usage'
        name: clickhouse_service_scheduled_scaling
        title: clickhouse_service_scheduled_scaling Resource - clickhouse
        examples:
            - name: example
              manifest: |-
                {
                  "entries": [
                    {
                      "end_hour_utc": 18,
                      "idle_scaling": false,
                      "max_replicas": 3,
                      "min_replicas": 3,
                      "name": "Business hours",
                      "start_hour_utc": 8,
                      "weekdays": [
                        1,
                        2,
                        3,
                        4,
                        5
                      ]
                    },
                    {
                      "end_hour_utc": 6,
                      "idle_scaling": true,
                      "idle_timeout_minutes": 5,
                      "max_replicas": 1,
                      "min_replicas": 1,
                      "name": "Overnight",
                      "start_hour_utc": 22,
                      "weekdays": [
                        0,
                        1,
                        2,
                        3,
                        4,
                        5,
                        6
                      ]
                    }
                  ],
                  "service_id": "${clickhouse_service.example.id}"
                }
              references:
                service_id: clickhouse_service.example.id
            - name: example
              manifest: |-
                {
                  "entries": [
                    {
                      "end_hour_utc": 18,
                      "idle_scaling": false,
                      "max_replicas": 3,
                      "min_replicas": 3,
                      "name": "Business hours",
                      "start_hour_utc": 8,
                      "weekdays": [
                        1,
                        2,
                        3,
                        4,
                        5
                      ]
                    },
                    {
                      "end_hour_utc": 6,
                      "idle_scaling": true,
                      "idle_timeout_minutes": 5,
                      "max_replicas": 1,
                      "min_replicas": 1,
                      "name": "Overnight",
                      "start_hour_utc": 22,
                      "weekdays": [
                        0,
                        1,
                        2,
                        3,
                        4,
                        5,
                        6
                      ]
                    }
                  ],
                  "service_id": "${clickhouse_service.svc.id}"
                }
              references:
                service_id: clickhouse_service.svc.id
              dependencies:
                clickhouse_service.svc: '{}'
        argumentDocs:
            base_config: (Attributes) Fallback configuration applied when no entry is currently active. Server-managed. (see below for nested schema)
            end_hour_utc: accepts 1–24.
            end_hour_utc < start_hour_utc: to wrap overnight (e.g. 22 to 6 covers 22:00–06:00 next day).
            entries: (Attributes Set) Recurring scaling windows. The server rejects any pair of entries that overlap in time, so at most one window is active at any moment; otherwise base_config applies. (see below for nested schema)
            id: (String) Resource identifier. Equal to service_id (one schedule per service).
            idle_scaling: (Boolean) Whether idle scaling is enabled while the window is active.
            idle_timeout_minutes: (Number) Minutes of inactivity before the service scales to zero. Must be at least 5. Only meaningful when idle_scaling is true.
            max_replica_memory_gb: (Number) Maximum memory per replica in GiB. Must be set together with min_replica_memory_gb.
            max_replicas: (Number) Maximum replica count while the window is active. Currently the server requires min_replicas == max_replicas.
            min_replica_memory_gb: (Number) Minimum memory per replica in GiB. Must be set together with max_replica_memory_gb.
            min_replicas: (Number) Minimum replica count while the window is active. Currently the server requires min_replicas == max_replicas.
            name: (String) Human-readable name for the entry (e.g. "Business hours").
            service_id: (String) ClickHouse Cloud service ID this schedule applies to.
            start_hour_utc: accepts 0–23.
            start_hour_utc = 0: and end_hour_utc = 24 for a 24-hour window.
            weekdays: (Set of Number) Weekdays this entry covers. 0 = Sunday … 6 = Saturday.
        importStatements:
            - |-
              #!/bin/bash
              # Scheduled scaling can be imported by specifying the service ID.
              terraform import clickhouse_service_scheduled_scaling.example xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
