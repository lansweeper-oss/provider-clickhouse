        description: 'Service is the Schema for the Services API. ~> Note: This resource
          is in alpha and its behavior may change in future provider versions. Manages
          a ClickHouse Cloud Managed Postgres https://clickhouse.com/cloud/postgres
          service. A Managed Postgres service is a fully-managed Postgres instance
          provisioned in the ClickHouse Cloud control plane. Supported lifecycle Create
          — standard, as a read replica (read_replica_of), or by point-in-time restore
          (restore_to_point_in_time)ReadUpdate — size, ha_type, tags, pg_config, pgbouncer_config,
          password rotationDeleteImport Three companion data sources are also provided
          (alpha): clickhouse_postgres_service, clickhouse_postgres_services, and
          clickhouse_postgres_service_ca_certificates. Unsupported attributes The
          following are intentionally absent from the schema: Operational commands
          (restart / promote / switchover). See "Operational commands" below for the
          rationale.IP allowlist, private endpoints, backup configuration, maintenance
          windows, customer-managed encryption keys, BYOC. These depend on server-side
          endpoint additions.Configurable lifecycle timeouts — there is no timeouts
          {} block; the provider uses fixed internal poll/retry budgets. Tag semantics
          Tags are a map(string → string) — same shape as clickhouse_service. Values
          must be non-empty alphanumeric / . / - / _ strings (server regex ^[a-zA-Z0-9._-]+$);
          the server''s PATCH endpoint returns 400 BAD_REQUEST on omitted values,
          so the schema rejects empty values at plan time. Setting tags = {} clears
          all user-controlled tags. Omitting the attribute entirely preserves the
          prior state value (Optional + Computed + UseStateForUnknown). The Postgres
          PATCH endpoint has PUT-like semantics specifically for the tags field: omitting
          it from the request body clears all tags server-side. The provider works
          around this by re-asserting the current state tags in every PATCH that mutates
          size or ha_type, so users won''t lose tags when they resize or change HA
          mode. This is invisible end-to-end but worth knowing if you inspect TF_LOG=DEBUG
          request bodies — you''ll see tags repeated on non-tag mutations. Runtime
          configuration (pg_config / pgbouncer_config) Postgres server parameters
          and PgBouncer pooler parameters are managed as map(string → string) (same
          shape as tags):'
