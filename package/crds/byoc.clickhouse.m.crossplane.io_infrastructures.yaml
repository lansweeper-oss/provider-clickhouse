                    type: string
                  vpcId:
                    description: |-
                      VPC: ID of the customer-managed VPC to deploy into instead of a ClickHouse-managed one.
                      BYO-VPC: ID of the customer-managed VPC to deploy into instead of a ClickHouse-managed one.
                    type: string
