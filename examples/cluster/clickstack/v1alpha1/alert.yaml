apiVersion: clickstack.clickhouse.crossplane.io/v1alpha1
kind: Alert
metadata:
  annotations:
    meta.upbound.io/example-id: clickstack/v1alpha1/alert
  labels:
    testing.upbound.io/example-name: too_many_errors
  name: too-many-errors
spec:
  forProvider:
    channels:
    - type: webhook
      webhookId: ${clickhouse_clickstack_webhook.slack.id}
    - type: webhook
      webhookId: ${clickhouse_clickstack_webhook.pagerduty.id}
    interval: 5m
    message: Error volume exceeded threshold
    name: Too many production errors
    savedSearchIdSelector:
      matchLabels:
        testing.upbound.io/example-name: errors
    threshold: 100
    thresholdType: above

---

apiVersion: clickstack.clickhouse.crossplane.io/v1alpha1
kind: Dashboard
metadata:
  annotations:
    meta.upbound.io/example-id: clickstack/v1alpha1/alert
  labels:
    testing.upbound.io/example-name: latency
  name: latency
spec:
  forProvider:
    dashboardJson: |-
      ${jsonencode({
          name = "Latency"
          tiles = [
            {
              name = "p95 latency"
              x    = 0
              y    = 0
              w    = 12
              h    = 6
              config = {
                displayType = "line"
                sourceId    = clickhouse_clickstack_source.traces.id
                select = [
                  {
                    aggFn           = "quantile"
                    level           = 0.95
                    valueExpression = "Duration"
                  }
                ]
              }
            }
          ]
        })}
