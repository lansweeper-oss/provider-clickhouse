name: ClickHouse/clickhouse
resources:
    clickhouse_organization_settings:
        subCategory: ""
        description: 'You can use the clickhouse_organization_settings resource to manage organization-level settings in ClickHouse Cloud. ~> Note: This resource manages settings for the organization configured in the provider. Only one instance of this resource should exist per organization. Example Usage'
        name: clickhouse_organization_settings
        title: clickhouse_organization_settings Resource - clickhouse
        examples:
            - name: org_settings
              manifest: |-
                {
                  "core_dumps_enabled": true
                }
            - name: this
              manifest: |-
                {
                  "core_dumps_enabled": true
                }
        argumentDocs:
            core_dumps_enabled: (Boolean) Whether core dumps collection is enabled for services in the organization. Defaults to the organization's current setting if not specified.
            id: (String) ID of the organization. This is set automatically from the provider configuration.
        importStatements:
            - |-
              #!/bin/bash
              # The organization settings resource can be imported using the organization ID
              terraform import clickhouse_organization_settings.this xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    clickhouse_private_endpoint_registration Resource - clickhouse:
        subCategory: ""
        description: This resource is deprecated since version 3.2.0. Please refer to the docs https://github.com/ClickHouse/terraform-provider-clickhouse?tab=readme-ov-file#breaking-changes-and-deprecations for migration steps.
        name: clickhouse_private_endpoint_registration Resource - clickhouse
        title: clickhouse_private_endpoint_registration Resource - clickhouse
        argumentDocs:
            cloud_provider: (String) Cloud provider of the private endpoint ID
            description: (String) Description of the private endpoint
            private_endpoint_id: (String) ID of the private endpoint (replaces deprecated attribute id)
            region: (String) Region of the private endpoint
        importStatements: []
    clickhouse_service:
        subCategory: ""
        description: 'You can use the clickhouse_service resource to deploy ClickHouse cloud instances on supported cloud providers. Known limitations: If you create a service with warehouse_id set and then remove warehouse_id attribute completely, the provider won''t detect the change. If you want to make a secondary service become primary, remove the warehouse_id and taint it before applying.If you create a service with readonly flag set to true and then remove readonly flag completely, the provider won''t detect the change. If you want to make a secondary service read write, explicitly set the readonly flag to false.'
        name: clickhouse_service
        title: clickhouse_service Resource - clickhouse
        examples:
            - name: service
              manifest: |-
                {
                  "cloud_provider": "aws",
                  "idle_scaling": true,
                  "idle_timeout_minutes": 5,
                  "ip_access": [
                    {
                      "description": "Test IP",
                      "source": "192.168.2.63"
                    }
                  ],
                  "max_total_memory_gb": 360,
                  "min_total_memory_gb": 24,
                  "name": "My Service",
                  "password_hash": "n4bQgYhMfWWaL+qgxVrQFaO/TxsrC4Is0V1sFbDwCgg=",
                  "region": "us-east-1",
                  "tags": {
                    "Environment": "Staging"
                  }
                }
        argumentDocs:
            allowed_origins: (String) Comma separated list of domain names to be allowed cross-origin resource sharing (CORS) access to the query API. Leave this field empty to restrict access to backend servers only
            api_key_ids: (List of String) The UUIDs of the API Keys to grant access to the query API.
            backup_configuration: (Attributes) Configuration of service backup settings. (see below for nested schema)
            backup_id: (String) ID of the backup to restore when creating new service. If specified, the service will be created as a restore operation
            backup_period_in_hours: (Number) Interval in hours between each backup.
            backup_retention_period_in_hours: (Number) How long in hours to keep a backup before deleting it.
            backup_start_time: (String) Time of the day in UTC that indicates the start time of a 2 hours window to be used for backup. If set, backup_period_in_hours must be null and backups are created once a day.
            byoc_id: (String) BYOC ID related to the cloud provider account you want to create this service into.
            cloud_provider: (String) Cloud provider ('aws', 'gcp', or 'azure') in which the service is deployed in.
            compliance_type: '(String) Compliance type of the service. Can be ''hipaa'', ''pci''. Required for organizations that wish to deploy their services in the hipaa/pci compliant environment. NOTE: hipaa/pci compliance should be enabled for your ClickHouse organization before using this field.'
            description: (String) Description of the IP address.
            double_sha1_password_hash: (String, Sensitive) Double SHA1 hash of password for connecting with the MySQL protocol. Cannot be specified if password or password_wo is specified.
            enable_core_dumps: (Boolean) Enable core dumps for the service.
            enabled: (Boolean) Wether to enable the mysql endpoint or not.
            encryption_assumed_role_identifier: (String) Custom role identifier ARN.
            encryption_key: (String) Custom encryption key ARN.
            endpoint_service_id: (String) Unique identifier of the interface endpoint you created in your VPC with the AWS(Service Name) or GCP(Target Service) resource.
            endpoints: (Attributes) Allow to enable and configure additional endpoints (read protocols) to expose on the ClickHouse service. (see below for nested schema)
            host: (String) Endpoint host.
            https: (Attributes) (see below for nested schema)
            iam_role: (String) IAM role used for accessing objects in s3.
            id: (String) ID of the created service. Generated by ClickHouse Cloud.
            idle_scaling: (Boolean) When set to true the service is allowed to scale down to zero when idle.
            idle_timeout_minutes: (Number) Set minimum idling timeout (in minutes). Must be greater than or equal to 5 minutes. Must be set if idle_scaling is enabled.
            ip_access: (Attributes List) List of IP addresses allowed to access the service. (see below for nested schema)
            is_primary: (Boolean) If true, it indicates this is a primary service using its own data. If false it means this service is a secondary service, thus using data from a warehouse.
            max_replica_memory_gb: (Number) Maximum memory of a single replica during auto-scaling in GiB.
            max_total_memory_gb: (Number, Deprecated) Maximum total memory of all workers during auto-scaling in GiB.
            min_replica_memory_gb: (Number) Minimum memory of a single replica during auto-scaling in GiB.
            min_total_memory_gb: (Number, Deprecated) Minimum total memory of all workers during auto-scaling in GiB.
            mysql: (Attributes) (see below for nested schema)
            name: (String) User defined identifier for the service.
            nativesecure: (Attributes) (see below for nested schema)
            num_replicas: (Number) Number of replicas for the service.
            password: (String, Sensitive) Password for the default user. One of either password, password_wo, or password_hash must be specified.
            password_hash: (String, Sensitive) SHA256 hash of password for the default user. One of either password, password_wo, or password_hash must be specified.
            password_wo: (String, Sensitive) Password for the default user (write-only, not persisted to state). Use this instead of password to avoid storing the password hash in Terraform state.
            password_wo_version: (Number) Version number for password_wo. Increment this to trigger a password update when using password_wo.
            port: (Number) Endpoint port.
            private_dns_hostname: (String) Private DNS Hostname of the VPC you created.
            private_endpoint_config: (Attributes) Service config for private endpoints (see below for nested schema)
            query_api_endpoints: (Attributes) Configuration of the query API endpoints feature. (see below for nested schema)
            readonly: flag set to true and then remove readonly flag completely, the provider won't detect the change. If you want to make a secondary service read write, explicitly set the readonly flag to false.
            region: (String) Region within the cloud provider in which the service is deployed in.
            release_channel: (String) Release channel to use for this service. Can be 'default', 'fast' or 'slow'.
            role_id: (String) ID of Role to be used for granting access to the Encryption Key. This is an ARN for AWS services and a Service Account Identifier for GCP.
            roles: (List of String) The Database role that will be used to run the query.
            source: (String) IP address allowed to access the service. In case you want to set the ip_access to anywhere you should set source to 0.0.0.0/0
            tags: (Map of String) Tags associated with the service as key-value pairs.
            tier: '(String) Tier of the service: ''development'', ''production''. Required for organizations using the Legacy ClickHouse Cloud Tiers, must be omitted for organizations using the new ClickHouse Cloud Tiers.'
            transparent_data_encryption: (Attributes) Configuration of the Transparent Data Encryption (TDE) feature. Requires an organization with the Enterprise plan. (see below for nested schema)
            warehouse_id: set and then remove warehouse_id attribute completely, the provider won't detect the change. If you want to make a secondary service become primary, remove the warehouse_id and taint it before applying.
        importStatements:
            - |-
              # Services can be imported by specifying the UUID.
              terraform import clickhouse_service.example xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    clickhouse_service_private_endpoints_attachment:
        subCategory: ""
        description: 'Use the clickhouse_service_private_endpoints_attachment resource to attach a ClickHouse service to a Private Endpoint. Important: Please note that if you want to attach the same ClickHouse service to multiple Private Endpoints you have to specify all the Private Endpoint IDs in a single clickhouse_service_private_endpoints_attachment resource. Having multiple clickhouse_service_private_endpoints_attachment resources for the same service is unsupported and the outcome is unpredictable. See private_endpoint_registration https://registry.terraform.io/providers/ClickHouse/clickhouse/latest/docs/resources/private_endpoint_registration for how to create a private endpoint. See full example https://github.com/ClickHouse/terraform-provider-clickhouse/tree/main/examples/full/private_endpoint on GitHub.'
        name: clickhouse_service_private_endpoints_attachment
        title: clickhouse_service_private_endpoints_attachment Resource - clickhouse
        examples:
            - name: attachment
              manifest: |-
                {
                  "private_endpoint_ids": [
                    "${clickhouse_private_endpoint_registration.endpoint.id}"
                  ],
                  "service_id": "${clickhouse_service.svc.id}"
                }
              references:
                private_endpoint_ids: clickhouse_private_endpoint_registration.endpoint.id
                service_id: clickhouse_service.svc.id
              dependencies:
                clickhouse_private_endpoint_registration.endpoint: '{}'
                clickhouse_service.svc: '{}'
        argumentDocs:
            private_endpoint_ids: (List of String) List of private endpoint IDs
            service_id: (String) ClickHouse Service ID
        importStatements:
            - |-
              # Endpoint Attachments can be imported by specifying the clickhouse service UUID
              terraform import clickhouse_service_private_endpoints_attachment.example xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    clickhouse_service_transparent_data_encryption_key_association:
        subCategory: ""
        description: You can use the clickhouse_service_transparent_data_encryption_key_association resource to associate your own Encryption Key with a Clickhouse Service with the Transparent Data Encryption (TDE) feature enabled. Please note that this feature requires an organization with the Enterprise plan.
        name: clickhouse_service_transparent_data_encryption_key_association
        title: clickhouse_service_transparent_data_encryption_key_association Resource - clickhouse
        examples:
            - name: service_key_association
              manifest: |-
                {
                  "key_id": "${aws_kms_key.enc.arn}",
                  "service_id": "${clickhouse_service.service.id}"
                }
              references:
                key_id: aws_kms_key.enc.arn
                service_id: clickhouse_service.service.id
              dependencies:
                aws_kms_key.enc: '{}'
                clickhouse_service.service: '{}'
        argumentDocs:
            key_id: (String) ID of the Encryption key to use for data encryption. Must be an ARN for AWS services or a Key Resource Path for GCP services.
            service_id: (String) ClickHouse Service ID
        importStatements:
            - |-
              # Endpoint Attachments can be imported by specifying the clickhouse service UUID
              terraform import clickhouse_service_transparent_data_encryption_key_association.example xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
