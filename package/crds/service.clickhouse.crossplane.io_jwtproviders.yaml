                      Expected `aud` claim of the tokens.
                    type: string
                  issuer:
                    description: |-
                      Expected `iss` claim of the tokens.
                    type: string
                  jwksUrl:
                    description: |-
                      Public `https://` URL of the JSON Web Key Set used to verify token signatures. It must contain at least one RS256 (RSA) key and is fetched and validated on every create and update.
                    type: string
                  name:
                    description: |-
                      Name of the JWT provider, unique within the service. Lowercase letters, digits and hyphens, at most 59 characters. Cannot be `cloud`, `clickhouse`, `ch`, `internal`, `system` or `default`, or start with one of these followed by a hyphen.
                    type: string
                  rolesClaim:
                    description: |-
                      Name of the token claim that lists the ClickHouse roles to grant the user. Cannot be a registered JWT claim (`iss`, `sub`, `aud`, `exp`, `nbf`, `iat`, `jti`). If omitted, users only get the permissions of the `default` user.
                    type: string
                  serviceId:
                    description: |-
                      ID of the ClickHouse Cloud service the JWT provider is configured on.
                    type: string
                  serviceIdRef:
                    description: Reference to a Service in clickhouse to populate
                      serviceId.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  serviceIdSelector:
                    description: Selector for a Service in clickhouse to populate
                      serviceId.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                type: object
              initProvider:
                description: |-
