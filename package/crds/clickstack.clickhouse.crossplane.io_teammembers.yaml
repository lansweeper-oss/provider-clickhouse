          a pending invitation is created (status = pending) and invite_url is populated.
          Note: on ClickHouse Cloud, team membership is managed through ClickHouse
          Cloud (the clickhouse_role_assignment resource), not the ClickStack API;
          this resource is for self-hosted ClickStack.'
