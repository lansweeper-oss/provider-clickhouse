apiVersion: postgres.clickhouse.m.crossplane.io/v1alpha1
kind: Service
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1alpha1/service
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    cloudProvider: aws
    haType: async
    name: my-postgres
    passwordSecretRef:
      key: example-key
      name: example-secret
    region: us-east-1
    size: m6gd.large
    tags:
      environment: production
      team: data
