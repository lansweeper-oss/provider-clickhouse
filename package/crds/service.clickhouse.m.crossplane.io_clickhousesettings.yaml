        description: 'ClickhouseSettings is the Schema for the ClickhouseSettingss
          API. You can use the clickhouse_service_clickhouse_settings resource to
          configure ClickHouse settings, such as max_query_size, on a ClickHouse Cloud
          service. For more information, see Update ClickHouse settings https://clickhouse.com/docs/products/cloud/api-reference/service/service-clickhouse-settings-update.
          The settings schema endpoint https://clickhouse.com/docs/products/cloud/api-reference/service/service-clickhouse-settings-schema-get
          lists the settings you can configure, with their types and warnings. The
          API is in beta and the list can change, so the resource takes a map instead
          of one attribute per setting. ~> Note: This resource is in beta. The ClickHouse
          settings API must be enabled for your organization. Reach out to ClickHouse
          support if the API returns 403 FORBIDDEN. Writing settings needs an API
          key with the control-plane:service:manage permission. Only the settings
          listed in settings are managed. Removing a setting from settings, or destroying
          the resource, resets it to the platform default. Values are strings. A value
          that is a whole number, such as "262144", is sent to the API as an integer,
          and any other value as a string. Pausing background merges Set shared_merge_tree_disable_merges_and_mutations_assignment
          to "1" to stop new merges and mutations from being assigned, and remove
          it to resume them. Applying it restarts the service, and table size and
          read amplification grow while merges are off, so keep it to short debugging
          windows.example <service_id> Import adopts every setting currently configured
          on the service, including ones ClickHouse Cloud manages, such as compatibility.
          Keep them in settings, otherwise the next apply resets them.'
